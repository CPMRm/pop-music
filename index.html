<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>極簡流行樂串流播放器</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #1f1c2c 0%, #928dab 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #1db954;
      --primary-hover: #1ed760;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.65);
      --sat-top: env(safe-area-inset-top, 0px);
      --sat-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0c20;
      color: var(--text-main);
    }

    /* 全螢幕 App 容器 */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* 動態視埠高度支援 */
      padding-top: var(--sat-top);
      padding-bottom: calc(var(--sat-bottom) + 12px);
      background: radial-gradient(circle at top, #2b1055, #7597de, #0f0c20);
      background-size: 200% 200%;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 頂部搜尋列 */
    .header-bar {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 44px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 0 16px 0 42px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input::placeholder {
      color: var(--text-sub);
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--text-sub);
      pointer-events: none;
    }

    .btn-search {
      min-width: 64px;
      height: 44px;
      background: var(--primary);
      border: none;
      border-radius: 22px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
      transition: transform 0.1s active;
    }

    .btn-search:active {
      transform: scale(0.95);
    }

    /* 主區域：可切換/滾動 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    /* 搜尋結果選單（拉下彈出層） */
    .search-results {
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      max-height: 280px;
      background: rgba(20, 18, 30, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      z-index: 20;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .search-results.active {
      display: block;
    }

    .result-item {
      min-height: 52px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .result-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .result-title {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 唱片與封面圖區塊 */
    .player-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 12px 0;
      width: 100%;
    }

    .album-cover-wrapper {
      position: relative;
      width: min(62vw, 240px);
      height: min(62vw, 240px);
      border-radius: 50%;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-cover {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      animation: rotateAlbum 20s linear infinite;
      animation-play-state: paused;
    }

    .album-cover.playing {
      animation-play-state: running;
    }

    /* 黑膠唱片中心孔位擬真 */
    .album-cover-wrapper::after {
      content: '';
      position: absolute;
      width: 36px;
      height: 36px;
      background: #0f0c20;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    }

    @keyframes rotateAlbum {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 歌曲與歌手文字 */
    .meta-info {
      text-align: center;
      margin-top: 16px;
      width: 100%;
      padding: 0 10px;
    }

    .song-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.3px;
    }

    .song-artist {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 400;
    }

    /* 歌詞區塊 (可滑動) */
    .lyrics-container {
      width: 100%;
      flex: 1;
      max-height: 140px;
      margin: 12px 0;
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      line-height: 1.8;
      mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, transparent 100%);
    }

    /* 隱藏滾動條 */
    .lyrics-container::-webkit-scrollbar,
    .search-results::-webkit-scrollbar,
    .main-content::-webkit-scrollbar {
      display: none;
    }

    /* 底部播放面板 */
    .player-controls {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 12, 32, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    audio {
      width: 100%;
      height: 40px;
      outline: none;
      filter: invert(0.9) hue-rotate(180deg); /* 調整預設 player 契合暗色 UI */
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 搜尋頭部 -->
    <div class="header-bar">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="keyword" class="search-input" placeholder="搜尋流行歌或歌手..." enterkeyhint="search">
      </div>
      <button class="btn-search" onclick="searchMusic()">搜尋</button>
    </div>

    <!-- 搜尋結果浮層 -->
    <div id="searchResults" class="search-results"></div>

    <!-- 主要互動區塊 -->
    <div class="main-content" onclick="closeResults()">
      
      <!-- 唱片視覺 -->
      <div class="player-visual">
        <div class="album-cover-wrapper">
          <img id="coverImg" class="album-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80" alt="專輯封面">
        </div>
        <div class="meta-info">
          <div id="songTitle" class="song-title">開源流行音樂</div>
          <div id="songArtist" class="song-artist">點擊搜尋播放喜歡的歌曲</div>
        </div>
      </div>

      <!-- 動態滾動歌詞 -->
      <div id="lyricsBox" class="lyrics-container">
        搜尋並選擇歌曲後<br>即可在這裡滑動瀏覽動態歌詞
      </div>

    </div>

    <!-- 底部控制列 -->
    <div class="player-controls">
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const coverImg = document.getElementById('coverImg');
    const searchResults = document.getElementById('searchResults');
    const keywordInput = document.getElementById('keyword');

    // 鍵盤按下 Enter 直接搜尋
    keywordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchMusic();
        keywordInput.blur();
      }
    });

    // 音訊播放狀態事件 handle（控制封面旋轉）
    audioPlayer.addEventListener('play', () => {
      coverImg.classList.add('playing');
    });

    audioPlayer.addEventListener('pause', () => {
      coverImg.classList.remove('playing');
    });

    audioPlayer.addEventListener('ended', () => {
      coverImg.classList.remove('playing');
    });

    function closeResults() {
      searchResults.classList.remove('active');
    }

    async function searchMusic() {
      const query = keywordInput.value.trim();
      if (!query) return;

      try {
        const res = await fetch(`https://music-api.he39.cn/search?keywords=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        searchResults.innerHTML = '';

        if (data.result && data.result.songs && data.result.songs.length > 0) {
          data.result.songs.slice(0, 8).forEach(song => {
            const artists = song.artists.map(a => a.name).join(', ');
            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `
              <div class="result-title">${escapeHtml(song.name)}</div>
              <div class="result-artist">${escapeHtml(artists)}</div>
            `;
            item.onclick = (e) => {
              e.stopPropagation();
              loadSong(song.id, song.name, artists);
              closeResults();
            };
            searchResults.appendChild(item);
          });
          searchResults.classList.add('active');
        } else {
          searchResults.innerHTML = `<div class="result-item"><div class="result-title">未找到相關歌曲</div></div>`;
          searchResults.classList.add('active');
        }
      } catch (err) {
        alert('網路請求失敗，請稍後重試');
      }
    }

    async function loadSong(id, title, artist) {
      document.getElementById('songTitle').innerText = title;
      document.getElementById('songArtist').innerText = artist;

      // 1. 取得專輯封面
      try {
        const detailRes = await fetch(`https://music-api.he39.cn/song/detail?ids=${id}`);
        const detailData = await detailRes.json();
        if (detailData.songs && detailData.songs[0]) {
          coverImg.src = detailData.songs[0].al.picUrl.replace('http://', 'https://');
        }
      } catch (e) {
        console.warn('封面載入失敗');
      }

      // 2. 取得歌詞
      const lyricsBox = document.getElementById('lyricsBox');
      lyricsBox.innerText = '歌詞載入中...';
      try {
        const lyricRes = await fetch(`https://music-api.he39.cn/lyric?id=${id}`);
        const lyricData = await lyricRes.json();
        
        if (lyricData.lrc && lyricData.lrc.lyric) {
          const cleanLyric = lyricData.lrc.lyric.replace(/\[.*?\]/g, '').trim();
          lyricsBox.innerText = cleanLyric || '暫無純文字歌詞';
        } else {
          lyricsBox.innerText = '未找到此歌曲歌詞';
        }
      } catch (e) {
        lyricsBox.innerText = '歌詞載入失敗';
      }

      // 3. 播放串流音樂
      audioPlayer.src = `https://music.163.com/song/media/outer/url?id=${id}.mp3`;
      audioPlayer.play().catch(() => {
        console.log('需要使用者互動後自動播放');
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
